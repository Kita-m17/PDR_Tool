 #server config
 # Honour a platform-injected PORT (e.g. Render sets this to 10000) if
 # present, otherwise fall back to 8080 - fly.io doesn't set PORT, so it
 # keeps using 8080 there via internal_port in fly.toml.
 server.port=${PORT:8080}

#application name
spring.application.name=pdr-tool

 #cross-origin requests from frontend
 spring.web.cors.allowed-origin="http://localhost:3000"